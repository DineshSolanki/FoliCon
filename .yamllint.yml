---
extends: default

rules:
  # GitHub Actions workflows frequently have long run commands or URLs
  line-length: disable

  # Allow flexible truthy values and avoid false positives on 'on:' triggers
  truthy:
    level: warning
    check-keys: false

  # Many YAML files omit the leading '---'
  document-start: disable

  # Allow single space before inline comments
  comments:
    min-spaces-from-content: 1

  # GitHub Actions indentation can be 2 spaces
  indentation:
    spaces: 2
    indent-sequences: whatever

  # Disable new-lines check for cross-platform compatibility
  new-lines: disable

ignore: |
  .git/
  bin/
  obj/
  packages/
  dist/
  crowdin.yml
  distribution/
  .github/FUNDING.yml
  .github/workflows/crowdin.yml
  .github/workflows/release.yml
